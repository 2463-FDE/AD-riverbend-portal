# intake-service configuration
self_service_intake: true
# ADR 0005 tier 1: normalized SSN + corroborating demographics. Flag-and-review
# only — a candidate match is queued for a human, never merged, and never blocks
# a registration. Tier 2 (fuzzy name + DOB where the SSN is missing or invalid)
# is deferred, so a row without a usable SSN is still de-duped by nothing.
match_key: ssn_corroborated
require_consent: true
eligibility_check: inline # verified on the request thread (RIV-088)
default_consents:
  - npp_ack
  - treatment_consent
default_created_via: self_service
