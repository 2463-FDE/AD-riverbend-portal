services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-riverbend}
      POSTGRES_USER: ${DB_USER:-riverbend_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-riverbend_app} -d ${DB_NAME:-riverbend}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    # NOT host-published, and password-protected (debt-log D3b, Codex PR #14
    # round 1). This store holds session tokens (username + role, and sessions
    # never expire — D10) and, since ADR 0011, visit memory: a payer member id
    # plus a coverage verdict. Publishing 6379 on the Docker host made all of
    # that readable and flushable by any process on the host, with no
    # application audit trail to scope the exposure afterwards. The gateway is
    # the only client and reaches it on the compose network.
    #
    # The password lives in its OWN env file, loaded by exactly redis +
    # gateway, for the same reason .env.ai-proxy does: compose hands the shared
    # .env to every container, and a credential there is a credential for every
    # service on the network. Guarded by tests/test_compose_topology.py.
    #
    # The rejected-value list mirrors security._PLACEHOLDER_REDIS_PASSWORDS on
    # purpose: if only the gateway rejected "changeme", redis would boot with it
    # and report HEALTHY while every request failed — the loud failure this
    # guard exists for, arriving silently. Kept in sync by
    # tests/test_compose_topology.py.
    #
    # The auth guard lives in the container command, NOT in a
    # `${REDIS_PASSWORD:?}` interpolation: compose resolves interpolations at
    # PARSE time, so `:?` would fail `docker compose build`/`config` in CI,
    # which seeds env files from the (deliberately empty) templates. Checking
    # inside the container fails closed where it matters — at boot, with a
    # refusal instead of an open port — and leaves parsing intact.
    expose:
      - "6379"
    env_file:
      - .env.redis
    command:
      - sh
      - -c
      - |
        case "$$(printf '%s' "$$REDIS_PASSWORD" | tr 'A-Z' 'a-z' | tr -d '[:space:]')" in
          ""|changeme|change-me|placeholder|password|redis|secret|todo|xxx)
            echo "REDIS_PASSWORD is empty or a placeholder - refusing to start a Redis holding sessions and visit memory (docs/debt-log.md D3b). Run 'make up', which generates a real one into .env.redis." >&2
            exit 1
            ;;
        esac
        exec redis-server --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: ./services/gateway
    # .env.ai-proxy holds AI_PROXY_SHARED_SECRET, scoped to exactly the two
    # ends of the gateway->ai-assistant auth boundary. It must never move into
    # the shared .env: env_file hands that file to every service, and any
    # secret holder can bypass the gateway session check on the paid LLM path.
    # `make up` creates the file from its template (empty = fail-closed 503).
    # Guarded by tests/test_compose_topology.py.
    # .env.redis holds REDIS_PASSWORD, scoped to redis + the gateway (its only
    # client) for the same reason .env.ai-proxy is scoped — see the redis
    # service above and docs/debt-log.md D3b.
    env_file:
      - .env
      - .env.ai-proxy
      - .env.redis
    environment:
      INTAKE_URL: http://intake-service:8071
      ELIGIBILITY_URL: http://eligibility-service:8072
      RECORDS_URL: http://records-service:8073
      SCHEDULING_URL: http://scheduling-service:8074
      INTEROP_URL: http://interop-service:8075
      ROI_URL: http://roi-service:8076
      AI_ASSISTANT_URL: http://ai-assistant:8077
    ports:
      - "8070:8070"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      intake-service:
        condition: service_started
      records-service:
        condition: service_started
      scheduling-service:
        condition: service_started
      roi-service:
        condition: service_started
      ai-assistant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8070/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  intake-service:
    build: ./services/intake-service
    env_file: .env
    environment:
      ELIGIBILITY_URL: http://eligibility-service:8072
    # Network-internal, like every domain service (ADR 0016, debt-log D15): no
    # domain service carries any auth of its own — the gateway session check is
    # the only auth boundary — so a published port is an unauthenticated
    # PHI read/write path from the Docker host. The gateway reaches these
    # services by compose DNS; `expose` documents the port its *_URL points at.
    # Host-side debugging goes through `docker compose exec gateway curl
    # http://<service>:<port>/...` or a gitignored docker-compose.override.yml
    # (ADR 0016 §4). Guarded by tests/test_compose_topology.py.
    expose:
      - "8071"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8071/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  eligibility-service:
    build: ./services/eligibility-service
    env_file: .env
    # Network-internal — see intake-service / ADR 0016.
    expose:
      - "8072"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8072/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  records-service:
    build: ./services/records-service
    env_file: .env
    # Network-internal — see intake-service / ADR 0016. This one served full
    # charts with clinical notes (and the unscoped /records/search) to any
    # host-side caller, no login required.
    expose:
      - "8073"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8073/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  scheduling-service:
    build: ./services/scheduling-service
    env_file: .env
    # Network-internal — see intake-service / ADR 0016. Codex PR #26 r3/r4
    # demonstrated GET /schedule (patient names + MRNs for a clinic day)
    # reachable here unauthenticated.
    expose:
      - "8074"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8074/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  interop-service:
    build: ./services/interop-service
    env_file: .env
    # Network-internal — see intake-service / ADR 0016. POST /hl7/ingest was an
    # unauthenticated PHI *write* path from the host. A real hospital ADT/ORU
    # feed gets dedicated authenticated ingress when one exists (ADR 0016 §5),
    # not a naked container port.
    expose:
      - "8075"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8075/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  roi-service:
    build: ./services/roi-service
    env_file: .env
    # Network-internal — see intake-service / ADR 0016. Fulfills
    # release-of-information disclosures; was host-reachable with no auth.
    expose:
      - "8076"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8076/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  ai-assistant:
    build: ./services/ai-assistant
    # .env.ai-proxy: see the gateway service — the secret reaches only the two
    # ends of the auth boundary, never the shared .env.
    env_file:
      - .env
      - .env.ai-proxy
    environment:
      # visit-chat calls eligibility-service directly (ADR 0011 §4), the same
      # service-to-service topology intake has always used. Bounded by a timeout
      # and an in-process breaker on the ai-assistant side.
      ELIGIBILITY_URL: http://eligibility-service:8072
    # Deliberately NOT published to the host (expose = compose-network only):
    # the endpoint has no auth of its own — the gateway session check is the
    # auth boundary, and every request spends paid Bedrock capacity. This was
    # the first service to drop its host publish (PR #7 r3); ADR 0016 later
    # applied the same rule to every domain service. Guarded by
    # tests/test_compose_topology.py.
    expose:
      - "8077"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8077/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  # The inherited Next.js portal -- the only frontend. The SvelteKit rebuild that
  # was to replace it is descoped (branch alt/sveltekit-portal), so "it is being
  # replaced" no longer holds and this service is not a coexistence-window
  # tenant. Registration is still BROKEN in it and still reports success -- see
  # docs/debt-log.md; that is now a live defect with no scheduled replacement,
  # not a defect waiting out a rewrite.
  frontend:
    build: ./frontend
    environment:
      GATEWAY_URL: http://gateway:8070
    ports:
      - "3070:3070"
    depends_on:
      - gateway
    # E1-SPEC-13..15: truthful health status. node:22-slim has no curl/wget, so
    # probe with a node -e HTTP GET — the language-native analogue of the
    # gateway's `python -c urllib` probe. start_period covers `next start` boot
    # (starting -> healthy); container-up but app-dead flips unhealthy within
    # interval*retries. Additive only: ports/build untouched (topology tests).
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3070/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
