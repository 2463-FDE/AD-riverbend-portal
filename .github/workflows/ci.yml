name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  # The SvelteKit portal's gate (ADR 0013 §5). A sibling job rather than an edit
  # to `frontend` above: that job sets working-directory at JOB level, so it
  # cannot be parameterized per step, and the legacy portal must keep building
  # unchanged for the FE-R15 coexistence window.
  #
  # Node 22 is the version that deploys (portal/Dockerfile). A JS gate proven
  # only on a developer's Node is proven on a version nothing runs.
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      # `npm ci`, not `npm install`: @vitest/browser-playwright peers vitest at an
      # EXACT version, so the committed lockfile is what keeps the pair in step.
      - run: npm ci
      - name: Install Chromium for the browser project
        run: npx playwright install --with-deps chromium
      # FE-R17's accessible-name gate. --fail-on-warnings is load-bearing:
      # without it svelte-check exits 0 on every a11y warning.
      - name: Type and accessibility check
        run: npm run check
      - run: npm run lint
      # Both projects: `client` in Chromium, `server` in Node under an ambient
      # TZ that is deliberately not the clinic's (ADR 0013 §4).
      - run: npm test
      - run: npm run build

  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - gateway
          - intake-service
          - eligibility-service
          - records-service
          - scheduling-service
          - interop-service
          - roi-service
          - ai-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r services/${{ matrix.service }}/requirements.txt
      - name: Import smoke test
        working-directory: services/${{ matrix.service }}
        run: python -c "import app; print('${{ matrix.service }} ok')"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        # NOTE: integration tests (marked @pytest.mark.integration) need a live
        # Postgres + Redis and are skipped here. Coverage of the security/auth
        # paths is thin — tracked in RIV-201.
        run: pytest -m "not integration" -q

  # Drift guard for the committed eval/rag/REPORT.md (RIV-160 deliverable) and for
  # db/seed/seed.sql (the file Postgres actually loads, byte-checked against its
  # deterministic generator): a seed change that left either stale was previously
  # invisible. No install step on purpose — the stub retriever path is standard
  # library only (eval/rag/retriever.py defers numpy and sentence-transformers into
  # EmbeddingRetriever._load), so this job must never pull eval/rag/requirements.txt
  # and the torch download behind it. §4's retrieval scores — and the eval code
  # that computes them — are excluded from the comparison; eval/rag/corpus.sha256
  # pins every DATA input byte, and check_drift.py's header owns the tradeoff.
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check eval/rag/REPORT.md and db/seed/seed.sql against their sources
        run: python eval/rag/check_drift.py

  # Secret scanning — recurrence guard for D9 (committed-secret exposure).
  # Scans the checked-out tree (--no-git) so any secret in a TRACKED file fails
  # the build: if a future change force-commits a gitignored secret file (e.g.
  # .env), it lands on disk at checkout and is caught here. This does NOT scan
  # full git history — the pre-existing .env/PHI-log blobs already in branch
  # history are separate, human-run remediation (rotate + history scrub +
  # force-push), owned in docs/debt-log.md. A dependency vuln scan and a
  # container image scan are still absent (remainder of D9).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks (tracked-tree scan, recurrence guard)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.18.4 \
            detect --source=/repo --no-git --redact --verbose --exit-code 1

  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend, portal, services, tests, secret-scan, eval]
    steps:
      - uses: actions/checkout@v4
      # .env and .env.ai-proxy are gitignored (untracked secret files). Compose
      # validates every env_file at parse time, so seed non-secret ones from
      # the committed examples. Both templates ship fail-closed (empty
      # secrets), so nothing here can weaken a guard.
      - name: Seed non-secret env from examples
        run: |
          cp .env.example .env
          cp .env.ai-proxy.example .env.ai-proxy
          cp .env.redis.example .env.redis
      - name: Build images
        run: docker compose build

      # `docker compose build` proves an image compiles, never that it runs, and
      # the portal is the one service where those come apart. adapter-node
      # rollup-bundles its runtime into `build/`, so `npm ci --omit=dev` leaves a
      # near-empty runtime dependency tree and the container boots anyway, which
      # codex r2 read as a guaranteed startup crash. Two rounds running, static
      # review has inferred a runtime failure in this scaffold and been wrong
      # (r1: the absent `svelte.config.js`), so `FE-R32` settles the argument
      # with a running container rather than another comment.
      #
      # `--no-deps` is load-bearing: portal `depends_on` gateway, whose own chain
      # waits on a healthy Postgres and Redis, and pulling that in would turn the
      # image-build gate into a mini-integration run. Alone, the portal still
      # exercises what this PR added — the published 3071, `ORIGIN` as runtime
      # config, and the container healthcheck, which is polled here rather than
      # merely declared. The compose-level smoke with the gateway attached earns
      # its cost in P2 PR 2, when the portal actually calls it.
      - name: Portal image serves /healthz
        run: |
          docker compose up -d --no-deps portal
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' \
              "$(docker compose ps -q portal)" 2>/dev/null || true)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker compose logs portal
          curl -fsS --max-time 10 http://localhost:3071/healthz
          echo
          [ "$status" = healthy ]
          docker compose down
