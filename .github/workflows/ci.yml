name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
      - run: npm run typecheck   # E1-SPEC-6,7
      - run: npm run lint        # E1-SPEC-8,9
      - run: npm test            # E1-SPEC-4,5

  # E1-REQ-7 / E1-SPEC-16,17: runtime boot check. `next build` (the frontend job)
  # proves the image COMPILES; this proves it SERVES. Standalone `docker run` of
  # the same Dockerfile the compose image builds — the health route needs no
  # gateway — then poll /healthz. A boot-broken image never answers 200, so the
  # job goes red and cannot ship green (closes TODO-45).
  frontend-boot:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t frontend-boot ./frontend
      # Pin the multi-stage invariant (codex r1): the runtime image is production-only.
      # Inspect the built image directly — `npm ls` in the repo would not catch a dev
      # dep leaking back into the shipped layer. vitest stands in for the dev toolchain.
      - name: Assert no devDependencies in runtime image
        run: |
          if docker run --rm frontend-boot ls node_modules/vitest >/dev/null 2>&1; then
            echo "devDependency 'vitest' leaked into the runtime image"; exit 1
          fi
          echo "runtime image is production-only"
      - run: docker run -d --name fe -p 3070:3070 frontend-boot
      - name: Poll /healthz (fail if not healthy in window)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3070/healthz; then echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "frontend did not become healthy"; docker logs fe; exit 1

  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - gateway
          - intake-service
          - eligibility-service
          - records-service
          - scheduling-service
          - interop-service
          - roi-service
          - ai-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r services/${{ matrix.service }}/requirements.txt
      - name: Import smoke test
        working-directory: services/${{ matrix.service }}
        run: python -c "import app; print('${{ matrix.service }} ok')"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        # NOTE: integration tests (marked @pytest.mark.integration) need a live
        # Postgres + Redis and are skipped here. Coverage of the security/auth
        # paths is thin — tracked in RIV-201.
        run: pytest -m "not integration" -q

  # Drift guard for the committed eval/rag/REPORT.md (RIV-160 deliverable) and for
  # db/seed/seed.sql (the file Postgres actually loads, byte-checked against its
  # deterministic generator): a seed change that left either stale was previously
  # invisible. No install step on purpose — the stub retriever path is standard
  # library only (eval/rag/retriever.py defers numpy and sentence-transformers into
  # EmbeddingRetriever._load), so this job must never pull eval/rag/requirements.txt
  # and the torch download behind it. §4's retrieval scores — and the eval code
  # that computes them — are excluded from the comparison; eval/rag/corpus.sha256
  # pins every DATA input byte, and check_drift.py's header owns the tradeoff.
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check eval/rag/REPORT.md and db/seed/seed.sql against their sources
        run: python eval/rag/check_drift.py

  # Secret scanning — recurrence guard for D9 (committed-secret exposure).
  # Scans the checked-out tree (--no-git) so any secret in a TRACKED file fails
  # the build: if a future change force-commits a gitignored secret file (e.g.
  # .env), it lands on disk at checkout and is caught here. This does NOT scan
  # full git history — the pre-existing .env/PHI-log blobs already in branch
  # history are separate, human-run remediation (rotate + history scrub +
  # force-push), owned in docs/debt-log.md. A dependency vuln scan and a
  # container image scan are still absent (remainder of D9).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks (tracked-tree scan, recurrence guard)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.18.4 \
            detect --source=/repo --no-git --redact --verbose --exit-code 1

  docker-build:
    runs-on: ubuntu-latest
    # Terminal fan-in: branch protection and any deploy automation read this job.
    # frontend-boot is in the list (codex r2) so a boot-broken frontend image
    # cannot present a green terminal signal.
    needs: [frontend, frontend-boot, services, tests, secret-scan, eval]
    steps:
      - uses: actions/checkout@v4
      # .env, .env.ai-proxy, .env.redis and .env.registration are gitignored
      # (untracked secret files). Compose validates every env_file at parse time,
      # so seed non-secret ones from the committed examples. Every template ships
      # fail-closed (empty secrets), so nothing here can weaken a guard — the
      # copies only have to let `docker compose build` parse the topology, and
      # this job never runs a container. tests/test_compose_topology.py asserts
      # this list covers every env_file the compose file lists.
      - name: Seed non-secret env from examples
        run: |
          cp .env.example .env
          cp .env.ai-proxy.example .env.ai-proxy
          cp .env.redis.example .env.redis
          cp .env.registration.example .env.registration
      # NOTE: these steps prove every image COMPILES, never that any of them runs.
      # Runtime coverage comes from the frontend-boot dependency above, and covers
      # the frontend only — a domain service that builds and then crashes on boot
      # is still invisible here.
      - name: Build images
        run: docker compose build
