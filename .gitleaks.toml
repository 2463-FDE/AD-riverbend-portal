# gitleaks configuration for the CI secret-scan (ci.yml `secret-scan` job — the
# D9 recurrence guard, docs/debt-log.md). It EXTENDS the upstream default rule
# set (never replaces it): every real credential pattern the default catches
# still fails the build. The only addition is a narrow allowlist for one
# documented synthetic test fixture that the entropy-based `generic-api-key`
# rule flags as a false positive.
#
# Scope discipline: the allowlist matches the exact 64-hex value below and
# nothing else — not a path, not the tests/ tree — so a real high-entropy secret
# committed to any file (test files included) still trips the scanner.

[extend]
useDefault = true

[allowlist]
description = """
Synthetic REGISTRATION_FINGERPRINT_KEY test fixture: a repeated
`0123456789abcdef` pattern used only to satisfy intake's key-real predicate
(>=32 chars, not a sentinel) in tests/test_intake_idempotency.py and
tests/test_intake_schema_guard.py. Never a live credential — the real key is
generated by `make up` into the gitignored .env.registration (e5b-D-13).
"""
regexes = [
  '''0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef''',
]
